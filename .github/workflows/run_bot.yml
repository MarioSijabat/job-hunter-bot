name: Daily Job Hunter Bot

on:
  schedule:
    # Berjalan setiap jam 8:00 Pagi WIB (UTC+7)
    # Cron format: Menit Jam Tanggal Bulan Hari
    - cron: "0 1,5,11 * * *" # 1,5,11 UTC = 8,12,18 WIB
  workflow_dispatch: # Tombol agar bisa menjalankan script ini manual dari tombol di GitHub

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Mengambil kode dari repository
        uses: actions/checkout@v3

      - name: Mempersiapkan Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Menginstal Library
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests
          pip install requests pandas python-jobspy tenacity

      - name: Menjalankan Bot Job Hunter
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
        run: python job_hunter.py
